      <button class="icon-btn edit on" data-guardar-deuda="${d.id}" aria-label="Guardar">${ICONS.check}</button>
      <button class="icon-btn del" data-borrar-deuda="${d.id}" aria-label="Quitar">${ICONS.trash}</button>
    </div>`;
  return `
    <div class="deuda-row">
      <button type="button" class="deuda-row__main" data-editar-deuda="${d.id}" aria-label="Editar">
        <span class="deuda-row__nombre">${escapeHtml(d.nombre)}</span>
      </button>
      <span class="deuda-row__amt">${fmt(d.importe)}</span>
    </div>`;
}

function renderTeDeben(){
  const lista = state.teDeben || [];
  const total = totalTeDeben();
  const cuerpo = teDebenAbierto ? `
    ${lista.length ? lista.map(filaDeuda).join('') : `<div class="hint" style="text-align:left; padding:6px 0 2px;">Nadie te debe nada ahora mismo.</div>`}
    <div class="deuda-edit nueva">
      <input class="deuda-nombre" id="deudaNombre" placeholder="Nombre">
      <input class="deuda-importe" id="deudaImporte" inputmode="decimal" placeholder="0,00">
      <button class="icon-btn edit" id="deudaAnadir" aria-label="Añadir">${ICONS.check}</button>
    </div>` : '';

  return `
    <div class="card">
      <button type="button" class="card-head gasto-head" id="teDebenToggle" aria-expanded="${teDebenAbierto}">
        <div class="icon" style="background:#F472B6">${ICONS.heart}</div>
        <span>Te deben${lista.length ? `<span class="gasto-periodo">${lista.length} ${lista.length===1?'persona':'personas'}</span>` : ''}</span>
        <div class="card-actions">
          <span class="deuda-total">${fmt(total)}</span>
          <span class="gasto-chevron ${teDebenAbierto?'abierto':''}">${ICONS.chevron}</span>
        </div>
      </button>
      ${cuerpo}
    </div>`;
}

function wireTeDeben(){
  const toggle = document.getElementById('teDebenToggle');
  if(toggle) toggle.addEventListener('click', ()=>{
    teDebenAbierto = !teDebenAbierto;
    teDebenEditando = null;
    renderHuchas();
  });

  const leer = (cont, campo)=> cont.querySelector(`[data-df="${campo}"]`).value;

  document.querySelectorAll('[data-editar-deuda]').forEach(b=>{
    b.addEventListener('click', ()=>{ teDebenEditando = b.dataset.editarDeuda; renderHuchas(); });
  });
  document.querySelectorAll('[data-guardar-deuda]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const cont = document.querySelector(`.deuda-edit[data-deuda="${b.dataset.guardarDeuda}"]`);
      editarDeuda(b.dataset.guardarDeuda, leer(cont,'nombre'),
                  parseFloat((leer(cont,'importe')||'0').replace(',','.')) || 0);
      teDebenEditando = null;
      renderHuchas();
    });
  });
  document.querySelectorAll('[data-borrar-deuda]').forEach(b=>{
    b.addEventListener('click', ()=>{
      borrarDeuda(b.dataset.borrarDeuda);
      teDebenEditando = null;
      renderHuchas();
    });
  });

  const anadir = document.getElementById('deudaAnadir');
  if(anadir) anadir.addEventListener('click', ()=>{
    const nombre = document.getElementById('deudaNombre').value;
    const importe = parseFloat((document.getElementById('deudaImporte').value||'0').replace(',','.')) || 0;
    if(!anadirDeuda(nombre, importe)) return;
    renderHuchas();
    // El panel queda abierto y con el foco listo para meter a otra persona.
    setTimeout(()=>{ const i = document.getElementById('deudaNombre'); if(i) i.focus(); }, 60);
  });
}

/* ============ RENDER: HUCHAS ============ */
let editingBucket = null;
const celebratedGoals = new Set();

/* proyección: media de aportación mensual real (últimos 3 meses) a esa hucha */
function avgMonthlyContribution(key, months=3){
  const recent = state.historial.slice(0, months).filter(h=>h.aportadoHuchas);
  if(recent.length===0) return 0;
  const total = recent.reduce((s,h)=> s + (h.aportadoHuchas[key]||0), 0);
  return total / recent.length;
}
function goalETA(key, cur, meta){
  if(meta<=0 || cur>=meta) return null;
  const avg = avgMonthlyContribution(key);
  if(avg <= 0.5) return null;
  const monthsLeft = Math.ceil((meta - cur) / avg);
  if(monthsLeft <= 0) return null;
  const d = new Date();
  d.setMonth(d.getMonth() + monthsLeft);
  const when = `${monthNames[d.getMonth()].charAt(0)}${monthNames[d.getMonth()].slice(1).toLowerCase()} ${d.getFullYear()}`;
  return { monthsLeft, when };
}

/* La conjunta no es dinero solo tuyo, asi que en esta pestaña vive aparte:
   ocupa la derecha de la cabecera y no tiene tarjeta propia. */
const CONJUNTA_KEY = 'conjunta';
const MIS_BUCKETS = BUCKETS.filter(b=> b.key !== CONJUNTA_KEY);

function renderHuchas(){
  const el = document.getElementById('view-huchas');
  const max = Math.max(1, ...MIS_BUCKETS.map(b=>state.huchas[b.key]));
  const totalMias = MIS_BUCKETS.reduce((s,b)=> s + state.huchas[b.key], 0);
  const conjunta = BUCKETS.find(b=> b.key === CONJUNTA_KEY);
  const saldoConjunta = state.huchas[CONJUNTA_KEY] || 0;
  const metaConjunta = state.metas[CONJUNTA_KEY] || 0;
  const editandoConjunta = editingBucket === CONJUNTA_KEY;

  const cabecera = `
    <div class="card" style="padding-top:14px;">
      <div class="hucha-split">
        <div class="hucha-half">
          <div class="hucha-half__label">Tus huchas</div>
          <div class="hucha-half__value">${fmt(totalMias)}</div>
        </div>
        <div class="hucha-split__divider"></div>
        <button type="button" class="hucha-half tappable" id="conjuntaTap" aria-label="Editar la hucha conjunta">
          <div class="hucha-half__label">Conjunta</div>
          <div class="hucha-half__value" style="color:${conjunta.color}">${fmt(saldoConjunta)}</div>
          <div class="hucha-half__hint">${editandoConjunta ? 'cerrar' : 'tocar para editar'}</div>
        </button>
      </div>
      ${editandoConjunta ? `
        <div class="edit-field" style="margin-top:12px;">
          <div class="label">Saldo conjunta</div>
          <input inputmode="decimal" id="bal-input-${CONJUNTA_KEY}" value="${saldoConjunta}">
        </div>
        <div class="edit-field">
          <div class="label">Meta (0 = sin meta)</div>
          <input inputmode="decimal" id="meta-input-${CONJUNTA_KEY}" value="${metaConjunta || ''}" placeholder="0,00">
        </div>
        <button class="btn" style="margin-top:10px;" data-save="${CONJUNTA_KEY}">${ICONS.check}Guardar</button>
      ` : ''}
    </div>
  `;

  el.innerHTML = cabecera + renderTeDeben() + MIS_BUCKETS.map(b=>{
    const cur = state.huchas[b.key];
    const meta = state.metas[b.key] || 0;
    const editing = editingBucket === b.key;
    const hasMeta = meta > 0;
    const pct = hasMeta ? Math.min(100, cur/meta*100) : (max>0 ? cur/max*100 : 0);
    const reached = hasMeta && cur >= meta;
    const eta = hasMeta && !reached ? goalETA(b.key, cur, meta) : null;

    return `
    <div class="card" data-bucket="${b.key}">
      <div class="card-head">
        <div class="icon" style="background:${b.color}">${ICONS[b.icon]}</div><span>${b.name}</span>
        <div class="card-actions">
          <button class="icon-btn edit ${editing?'on':''}" data-edit="${b.key}">${editing?ICONS.x:ICONS.pencil}</button>
        </div>
      </div>
      <div class="amount" style="font-size:30px; font-weight:800;">${fmt(cur)}</div>

      ${editing ? `
        <div class="edit-field" style="margin-top:10px;">
          <div class="label">Saldo actual</div>
          <input inputmode="decimal" id="bal-input-${b.key}" value="${cur}">
        </div>
        <div class="edit-field">
          <div class="label">Meta (0 = sin meta)</div>
          <input inputmode="decimal" id="meta-input-${b.key}" value="${meta || ''}" placeholder="0,00">
        </div>
        <button class="btn" style="margin-top:10px;" data-save="${b.key}">${ICONS.check}Guardar</button>
      ` : `
        <div class="bucket-bar"><div style="width:${pct.toFixed(1)}%; background:${reached?'#34D399':b.color};"></div></div>
        ${(()=>{ const c = huchaCorta(b.key); return c
          ? `<div class="hucha-aviso">Te queda menos de lo que sueles gastar aquí (${fmt(c.media)}/mes)</div>`
          : ''; })()}
        ${hasMeta
          ? `<div class="hint" style="text-align:left; margin-top:8px;">
               ${reached
                 ? '🎉 ¡Objetivo cumplido!'
                 : `${fmt(cur)} de ${fmt(meta)} · ${pct.toFixed(0)}%${eta ? ` · a este ritmo, en ${eta.monthsLeft} ${eta.monthsLeft===1?'mes':'meses'} (${eta.when})` : ''}`}
             </div>`
          : `<div class="hint" style="text-align:left; margin-top:8px;">Toca el lápiz para fijar saldo o una meta</div>`
        }
      `}
    </div>
  `}).join('');

  // celebra con confeti la primera vez que una hucha alcanza su meta
  MIS_BUCKETS.forEach(b=>{
    const meta = state.metas[b.key] || 0;
    const reached = meta > 0 && state.huchas[b.key] >= meta;
    if(reached && !celebratedGoals.has(b.key)){
      celebratedGoals.add(b.key);
      const card = el.querySelector(`[data-bucket="${b.key}"]`);
      if(card) confettiBurst(card);
    } else if(!reached){
      celebratedGoals.delete(b.key);
    }
  });

  wireTeDeben();

  el.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.edit;
      editingBucket = editingBucket===k ? null : k;
      renderHuchas();
    });
  });
  // La mitad derecha de la cabecera abre y cierra la edicion de la conjunta.
  const tapConjunta = document.getElementById('conjuntaTap');
  if(tapConjunta){
    tapConjunta.addEventListener('click', ()=>{
      editingBucket = editingBucket === CONJUNTA_KEY ? null : CONJUNTA_KEY;
      renderHuchas();
    });
  }
  el.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.save;
      const balInput = document.getElementById('bal-input-'+k);
      const metaInput = document.getElementById('meta-input-'+k);
      const balVal = parseFloat((balInput.value||'0').replace(',','.')) || 0;
      const metaVal = parseFloat((metaInput.value||'0').replace(',','.')) || 0;
      state.huchas[k] = Math.max(0, balVal);
      state.metas[k] = Math.max(0, metaVal);
      editingBucket = null;
      save();
      updateQuickStats();
      renderHuchas();
    });
  });
}

/* ============ RENDER: HISTORIAL ============ */
let editingIdx = null;
let deleteArmedIdx = null;

function renderHistorial(){
  const el = document.getElementById('view-historial');

  // Exportar/Importar viven ahora en el panel de cuenta (foto de perfil).
  const libro = renderLibroGastos();

  if(state.historial.length===0){
    el.innerHTML = libro + `<div class="empty">Todavía no has guardado ninguna nómina.<br>Guárdala desde Resumen para verla aquí.</div>`;
    wireLibroGastos();
    return;
  }

  const chart = state.historial.length>=2 ? `
    <div class="card">
      <div class="card-head"><div class="icon" style="background:#3D8BFD">${ICONS.trend}</div><span>Evolución del ahorro</span></div>
      ${sparkline(state.historial.slice().reverse().map(h=>h.neto))}
    </div>
  ` : '';

  // Se agrupa por mes y solo se despliegan los más recientes: con un año de
  // uso, pintar todas las tarjetas hace la pestaña interminable.
  const meses = [];
  state.historial.forEach((h,i)=>{
    const ultimo = meses[meses.length - 1];
    if(ultimo && ultimo.label === h.label) ultimo.entradas.push({h, i});
    else meses.push({ label:h.label, entradas:[{h, i}] });
  });
  const recientes = meses.slice(0, HISTORIAL_MESES);
  const antiguos = meses.slice(HISTORIAL_MESES);
  // Un mes archivado que se esté editando tiene que seguir viéndose.
  const editandoEnAntiguos = antiguos.some(m=> m.entradas.some(e=> e.i === editingIdx));
  const verAntiguos = historialAbierto || editandoEnAntiguos;

  const tarjeta = ({h, i})=>{
    const isEditing = editingIdx === i;
    const ah = h.aportadoHuchas || {ahorro:0,coche:0,caprichos:0};
    return `
    <div class="card" data-idx="${i}">
      <div class="card-head">
        <div class="icon" style="background:${h.tipo==='extra' ? '#34D399' : '#8B7CFA'}">${ICONS.trend}</div>
        <span>${h.label}${h.tipo==='extra' ? `<span class="entrada-tag">extra${h.concepto ? ' · ' + escapeHtml(h.concepto) : ''}</span>` : ''}</span>
        <div class="card-actions">
          <button class="icon-btn edit ${isEditing?'on':''}" data-act="edit" data-i="${i}">${isEditing?ICONS.x:ICONS.pencil}</button>
          <button class="icon-btn del ${deleteArmedIdx===i?'confirm':''}" data-act="del" data-i="${i}">${ICONS.trash}</button>
        </div>
      </div>
      ${!isEditing ? `
        <div class="row"><div class="label">Sueldo neto</div><div class="value">${fmt(h.neto)}</div></div>
        <div class="row"><div class="label">Gastos fijos</div><div class="value dim">${fmt(h.dist.gastos)}</div></div>
        <div class="row"><div class="label">Ahorro</div><div class="value dim">${fmt(h.dist.ahorro)}</div></div>
        <div class="row"><div class="label">Ocio</div><div class="value dim">${fmt(h.dist.ocio)}</div></div>
        <div class="highlight" style="margin-top:8px; flex-direction:column; align-items:flex-start; gap:6px;">
          <div class="label" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim);">Aportado a huchas</div>
          <div style="display:flex; gap:12px; font-size:12.5px; color:var(--text); flex-wrap:wrap;">
            ${BUCKETS.map(b=>`<span>${b.name} <b>${fmt(ah[b.key]||0)}</b></span>`).join('')}
          </div>
        </div>
      ` : `
        <div class="edit-field"><div class="label">Sueldo neto</div><input inputmode="decimal" data-f="neto" value="${h.neto}"></div>
        ${BUCKETS.map(b=>`
          <div class="edit-field">
            <div class="label"><span class="edit-punto" style="background:${b.color}"></span>${b.name}</div>
            <input inputmode="decimal" data-f="${b.key}" value="${ah[b.key] || 0}">
          </div>`).join('')}
        <div class="hint" style="text-align:left; margin-top:8px;">Son las cantidades que esta nómina aportó a cada hucha. Al guardar, los saldos se ajustan por la diferencia.</div>
        <button class="btn" style="margin-top:12px;" data-act="save" data-i="${i}">${ICONS.check}Guardar cambios</button>
      `}
    </div>
  `};

  const archivo = antiguos.length ? `
    <button type="button" class="btn ghost archivo-toggle" id="archivoToggle">
      ${verAntiguos ? 'Ocultar' : 'Ver'} ${antiguos.length} ${antiguos.length===1?'mes anterior':'meses anteriores'}
      <span class="gasto-chevron ${verAntiguos?'abierto':''}">${ICONS.chevron}</span>
    </button>` : '';

  el.innerHTML = libro + chart
    + recientes.flatMap(m=> m.entradas).map(tarjeta).join('')
    + archivo
    + (verAntiguos ? antiguos.flatMap(m=> m.entradas).map(tarjeta).join('') : '');

  wireLibroGastos();

  const toggleArchivo = document.getElementById('archivoToggle');
  if(toggleArchivo){
    toggleArchivo.addEventListener('click', ()=>{
      historialAbierto = !historialAbierto;
      renderHistorial();
    });
  }

  el.querySelectorAll('[data-act]').forEach(btn=>{
    const i = parseInt(btn.dataset.i);
    btn.addEventListener('click', ()=>{
      if(btn.dataset.act==='edit'){
        editingIdx = editingIdx===i ? null : i;
        deleteArmedIdx = null;
        renderHistorial();
      } else if(btn.dataset.act==='del'){
        if(deleteArmedIdx===i){
          deleteEntry(i);
        } else {
          deleteArmedIdx = i;
          renderHistorial();
          setTimeout(()=>{ if(deleteArmedIdx===i){ deleteArmedIdx=null; renderHistorial(); } }, 2800);
        }
      } else if(btn.dataset.act==='save'){
        saveEditEntry(i);
      }
    });
  });
}

/* Libro de gastos en Historial: de primeras solo los 3 últimos, y al
   pulsar la cabecera se despliegan todos agrupados por mes. */
const LIBRO_PREVIO = 3;
let libroAbierto = false;

/* Meses de nóminas que se ven sin desplegar; el resto van al archivo. */
const HISTORIAL_MESES = 3;
let historialAbierto = false;

/* Mismo formato que las etiquetas del historial de nóminas, para que los
   dos apartados de la pestaña hablen igual. */
function etiquetaMesDe(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return 'Sin fecha';
  return `${monthNames[d.getMonth()]} DE ${d.getFullYear()}`;
}

const importeGasto = g => (g.descontado != null ? g.descontado : g.importe);

function filaGasto(g){
  const b = bucketDe(g.bucket);
  const d = new Date(g.date);
  const dia = isNaN(d.getTime()) ? '' : DIA_MES.format(d);
  // El cuerpo de la fila abre la edición; repetir queda como botón aparte
  // porque crea un gasto nuevo y no conviene que salga sin querer.
  // El fondo rojo de borrado lleva su papelera desde CSS (imagen de fondo),
  // no como nodos SVG: multiplicado por cada fila costaba más que el resto.
  return `
    <div class="gasto-swipe" data-swipe="${g.id}">
      <div class="gasto-swipe__fondo"></div>
    <div class="gasto-row">
      <span class="gasto-row__dot" style="background:${b ? b.color : '#888'}"></span>
      <button type="button" class="gasto-row__main" data-editar="${g.id}" aria-label="Editar gasto">
        <div class="gasto-row__title">${escapeHtml(g.concepto) || (b ? b.name : g.bucket)}</div>
        <div class="gasto-row__meta">${dia}${b ? ' · ' + b.name : ''}${g.editado ? ' · editado' : ''}</div>
      </button>
      <div class="gasto-row__amount">−${fmt(importeGasto(g))}</div>
      <button class="icon-btn" data-repetir="${g.id}" aria-label="Repetir gasto"><svg viewBox="0 0 24 24"><use href="#ic-repeat"/></svg></button>
    </div>
    </div>`;
}

/* Agrupa manteniendo el orden en que están (del más nuevo al más viejo),
   así los meses salen del más reciente hacia atrás sin tener que ordenar. */
function agruparPorMes(gastos){
  const meses = [];
  for(const g of gastos){
    const etiqueta = etiquetaMesDe(g.date);
    const ultimo = meses[meses.length - 1];
    if(ultimo && ultimo.etiqueta === etiqueta) ultimo.gastos.push(g);
    else meses.push({ etiqueta, gastos:[g] });
  }
  return meses;
}

function renderLibroGastos(){
  const gastos = Array.isArray(state.gastos) ? state.gastos : [];
  if(gastos.length === 0) return '';
  // El total histórico solo sube y no dice nada; lo que importa es el mes
  // que estás viviendo. El histórico por meses está al desplegar.
  const mesActual = currentMonthLabel();
  const delMes = gastos.filter(g=> etiquetaMesDe(g.date) === mesActual);
  const totalMes = delMes.reduce((s,g)=> s + importeGasto(g), 0);

  const cuerpo = libroAbierto
    ? agruparPorMes(gastos).map(m=>`
        <div class="gasto-mes-bloque">
          <div class="gasto-mes">
            <div class="gasto-mes__titulo">${m.etiqueta}</div>
            <div class="gasto-mes__total">${fmt(m.gastos.reduce((s,g)=> s + importeGasto(g), 0))}</div>
          </div>
          ${m.gastos.map(filaGasto).join('')}
        </div>
      `).join('')
    : gastos.slice(0, LIBRO_PREVIO).map(filaGasto).join('');

  const pie = libroAbierto
    ? `<div class="gasto-pie">Toca para plegar</div>`
    : (gastos.length > LIBRO_PREVIO ? `<div class="gasto-pie">Toca para ver los ${gastos.length} gastos por meses</div>` : '');

  return `
    <div class="card">
      <button type="button" class="card-head gasto-head" id="libroToggle"
              aria-expanded="${libroAbierto}" aria-label="Ver todos los gastos">
        <div class="icon" style="background:#FF5A5F">${ICONS.minus}</div>
        <span>Gastos<span class="gasto-periodo">este mes</span></span>
        <div class="card-actions">
          <span class="gasto-total">${fmt(totalMes)}</span>
          <span class="gasto-chevron ${libroAbierto ? 'abierto' : ''}">${ICONS.chevron}</span>
        </div>
      </button>
      ${cuerpo}${pie}
    </div>`;
}

/* Los conceptos los escribe la persona, así que se escapan antes de
   inyectarlos en el HTML de la tarjeta. */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Los gestos y clics del libro se escuchan UNA vez en el contenedor, no
   fila a fila: con 260 gastos eran más de mil listeners que había que
   volver a colgar en cada repintado. El contenedor no se reemplaza nunca
   (solo su contenido), así que basta con engancharlos al arrancar. */
const SWIPE_BORRAR = 96;
let libroEnganchado = false;

function wireLibroGastos(){
  if(libroEnganchado) return;
  libroEnganchado = true;
  const vista = document.getElementById('view-historial');
  if(!vista) return;

  vista.addEventListener('click', e=>{
    const editar = e.target.closest('[data-editar]');
    if(editar){
      const g = (state.gastos||[]).find(x=> x.id === editar.dataset.editar);
      if(g) abrirGastoSheet(g);
      return;
    }
    const repetir = e.target.closest('[data-repetir]');
    if(repetir){
      const nuevo = repetirGasto(repetir.dataset.repetir);
      repintarTrasGasto();
      avisoGastoRegistrado(nuevo);
      return;
    }
    if(e.target.closest('#libroToggle')){
      libroAbierto = !libroAbierto;
      renderHistorial();
    }
  });

  /* Deslizar una fila hacia la izquierda la borra. El gesto de cambiar de
     pestaña vive en esta misma vista, así que las filas quedan excluidas de
     aquel (ver tIgnore más abajo) para que no se peleen. */
  let cont = null, fila = null, x0 = 0, y0 = 0, activo = false;

  vista.addEventListener('touchstart', e=>{
    cont = e.target.closest('.gasto-swipe');
    if(!cont) return;
    fila = cont.querySelector('.gasto-row');
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; activo = false;
    fila.style.transition = 'none';
  }, {passive:true});

  vista.addEventListener('touchmove', e=>{
    if(!cont) return;
    const dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    // Solo cuenta si es claramente horizontal y hacia la izquierda; si no,
    // se deja pasar para poder hacer scroll.
    if(!activo && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) activo = true;
    if(!activo || dx > 0) return;
    const d = Math.max(dx, -140);
    fila.style.transform = `translate3d(${d}px,0,0)`;
    cont.classList.toggle('armado', d <= -SWIPE_BORRAR);
  }, {passive:true});

  vista.addEventListener('touchend', e=>{
    if(!cont) return;
    const dx = e.changedTouches[0].clientX - x0;
    const c = cont, f = fila;
    cont = null; fila = null;
    f.style.transition = '';
    if(activo && dx <= -SWIPE_BORRAR){
      f.style.transform = 'translate3d(-100%,0,0)';
      // deshacerGasto ya devuelve el dinero a su hucha y repinta.
      setTimeout(()=> deshacerGasto(c.dataset.swipe), 180);
    } else {
      f.style.transform = '';
      c.classList.remove('armado');
    }
  }, {passive:true});
}

function wireToolbar(){
  const be = document.getElementById('btnExport');
  const bi = document.getElementById('btnImport');
  const fi = document.getElementById('fileImport');
  if(be) be.addEventListener('click', exportData);
  if(bi && fi){
    bi.addEventListener('click', ()=> fi.click());
    fi.addEventListener('change', importData);
  }
}

function deleteEntry(i){
  const h = state.historial[i];
  // revierte lo que esa nómina había aportado a las huchas
  if(h.aportadoHuchas){
    BUCKETS.forEach(b=>{
      state.huchas[b.key] = Math.max(0, state.huchas[b.key] - (h.aportadoHuchas[b.key]||0));
    });
  }
  state.historial.splice(i,1);
  deleteArmedIdx = null;
  editingIdx = null;
  save();
  updateStreakBadge();
  updateQuickStats();
  renderHistorial();
}

function saveEditEntry(i){
  const card = document.querySelector(`.card[data-idx="${i}"]`);
  const get = f => parseFloat((card.querySelector(`[data-f="${f}"]`).value||'0').replace(',','.')) || 0;
  const h = state.historial[i];
  const antes = h.aportadoHuchas || {};

  // Se reconcilian TODAS las huchas. Antes solo se ajustaban ahorro, coche y
  // caprichos, así que tocar Gastos u Ocio cambiaba el historial pero dejaba
  // el saldo de esas huchas como estaba: un descuadre silencioso.
  const nuevo = {};
  BUCKETS.forEach(b=>{ nuevo[b.key] = Math.max(0, get(b.key)); });
  BUCKETS.forEach(b=>{
    state.huchas[b.key] = Math.max(0, (state.huchas[b.key] || 0) - (antes[b.key] || 0) + nuevo[b.key]);
  });

  h.neto = get('neto');
  h.aportadoHuchas = nuevo;
  // El reparto principal se deriva de lo aportado: el ocio de la nómina es
  // la suma de ocio libre, coche y caprichos.
  h.dist = {
    gastos: nuevo.gastos,
    ahorro: nuevo.ahorro,
    ocio: nuevo.ocio + nuevo.coche + nuevo.caprichos,
  };

  editingIdx = null;
  save();
  updateStreakBadge();
  updateQuickStats();
  renderHistorial();
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finanzas-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(data && data.ingresos) state = mergeState(data);
      save();
      updateStreakBadge();
      updateQuickStats();
      // Se importa desde el panel de cuenta, que puede estar abierto sobre
      // cualquier pestaña: se cierra y se repinta la que esté activa.
      closeSheet();
      if(renderers[activeTab]) renderers[activeTab]();
    }catch(err){ alert('El archivo no es un backup válido de Finanzas.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function sparkline(values){
  const w = 300, h = 64, pad = 6;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1)) * (w-pad*2);
    const y = h - pad - ((v-min)/range) * (h-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#3D8BFD"/>`).join('');
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D8BFD" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3D8BFD" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/>
    <path d="${path}" fill="none" stroke="#3D8BFD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g>${dots}</g>
  </svg>`;
}

/* centered iOS-style alert popup */
function openAlert(icon, title, message, onYes, onNo){
  // Se conservan los ids de siempre: un diálogo de sí/no sigue teniendo
  // #alertNo y #alertYes aunque por dentro lo pinte openChoice.
  openChoice(icon, title, message, [
    { id:'alertNo', label:'No', ghost:true, onClick:onNo },

  ]);

/* Diálogo con las opciones que haga falta, en vez de solo sí/no. Las de
   más de dos se apilan, porque en horizontal no caben los textos. */
function openChoice(icon, title, message, opciones){
  const apiladas = opciones.length > 2;
  document.getElementById('alertBox').innerHTML = `
    <div class="alert-icon">${icon}</div>
    <h3>${title}</h3>

      ${opciones.map((o,i)=>`<button class="btn ${o.ghost?'ghost':''} ${o.danger?'danger':''}"${o.id?` id="${o.id}"`:''} data-opt="${i}" style="margin:0;">${o.label}</button>`).join('')}

/* Tocar fuera cancela, igual que en los paneles. Se comprueba que el toque
   sea en el fondo y no dentro del cuadro. */
document.getElementById('alertOverlay').addEventListener('click', e=>{
  if(e.target === e.currentTarget) closeAlert();
});
function closeAlert(){
  document.getElementById('alertOverlay').classList.remove('open');

/* ---------- Toast (aviso breve, con deshacer opcional) ---------- */
let toastTimer = null;
function showToast(texto, onUndo, ms){
  const el = document.getElementById('toast');
  const btn = document.getElementById('toastUndo');
  if(!el) return;
  document.getElementById('toastText').textContent = texto;
  btn.classList.toggle('hidden', !onUndo);
  // Se reemplaza el boton para que no se acumulen listeners de toasts previos.
  const nuevo = btn.cloneNode(true);
  btn.parentNode.replaceChild(nuevo, btn);
  if(onUndo){
    nuevo.addEventListener('click', ()=>{ hideToast(); onUndo(); });
  }
  el.classList.add('open');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, ms || 6000);
}
function hideToast(){
  clearTimeout(toastTimer);
  const el = document.getElementById('toast');
  if(el) el.classList.remove('open');
}

/* ---------- Libro de gastos ---------- */
/* Todo descuento de una hucha pasa por aqui, venga del sheet o del atajo
   por URL, para que siempre quede registrado y se pueda deshacer. */
function registrarGasto(bucketKey, importe, concepto){
  const bucket = BUCKETS.find(b=>b.key===bucketKey);
  if(!bucket || !(importe > 0)) return null;
  const antes = state.huchas[bucketKey] || 0;
  state.huchas[bucketKey] = Math.max(0, antes - importe);
  const gasto = {
    id: 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    date: new Date().toISOString(),
    bucket: bucketKey,
    importe: importe,
    // Si la hucha tenia menos saldo que el gasto, solo se resto hasta cero:
    // deshacer debe devolver eso, no el importe entero.
    descontado: antes - state.huchas[bucketKey],
    concepto: (concepto || '').trim(),
  };
  if(!Array.isArray(state.gastos)) state.gastos = [];
  state.gastos.unshift(gasto);
  save();
  return gasto;
}

function deshacerGasto(id){
  if(!Array.isArray(state.gastos)) return;
  const i = state.gastos.findIndex(g=> g.id === id);
  if(i === -1) return;
  const g = state.gastos[i];
  state.huchas[g.bucket] = (state.huchas[g.bucket] || 0) + (g.descontado != null ? g.descontado : g.importe);
  state.gastos.splice(i, 1);
  save();
  updateQuickStats();
  if(activeTab === 'huchas') renderHuchas();
  if(activeTab === 'historial') renderHistorial();
}

/* Editar toca dos saldos cuando cambia de hucha: devuelve lo descontado a
   la de origen y lo aplica en la de destino. La fecha original NO se toca,
   para que el gasto siga contando en el mes en que ocurrió. */
function editarGasto(id, bucketNuevo, importeNuevo, conceptoNuevo){
  if(!Array.isArray(state.gastos)) return null;
  const i = state.gastos.findIndex(g=> g.id === id);
  if(i === -1) return null;
  const bucket = BUCKETS.find(b=>b.key===bucketNuevo);
  if(!bucket || !(importeNuevo > 0)) return null;
  const g = state.gastos[i];

  state.huchas[g.bucket] = (state.huchas[g.bucket] || 0) + (g.descontado != null ? g.descontado : g.importe);
  const antes = state.huchas[bucketNuevo] || 0;
  state.huchas[bucketNuevo] = Math.max(0, antes - importeNuevo);

  g.bucket = bucketNuevo;
  g.importe = importeNuevo;
  g.descontado = antes - state.huchas[bucketNuevo];
  g.concepto = (conceptoNuevo || '').trim();
  g.editado = new Date().toISOString();
  save();
  return g;
}

/* Repetir crea un gasto nuevo con fecha de hoy; el original se queda donde
   estaba, porque son dos gastos distintos aunque se llamen igual. */
function repetirGasto(id){
  if(!Array.isArray(state.gastos)) return null;
  const g = state.gastos.find(x=> x.id === id);
  if(!g) return null;
  return registrarGasto(g.bucket, g.importe, g.concepto);
}

/* ---------- Bloqueo con Face ID ----------
   Usa WebAuthn con el autenticador del propio aparato. Es un cerrojo LOCAL:
   impide que alguien que coja el móvil desbloqueado abra la app, pero no
   cifra nada ni sustituye a la sesión de Firebase, que es lo que de verdad
   protege los datos. La credencial se guarda por dispositivo, no en la nube:
   activarlo en el móvil no bloquea el portátil. */
const CLAVE_FACEID = 'finanzas-faceid';

function hayFaceID(){
  return !!(window.PublicKeyCredential && navigator.credentials && location.protocol === 'https:');
}
function faceIDActivo(){
  try{ return !!localStorage.getItem(CLAVE_FACEID); }catch(e){ return false; }
}

const aBytes = s => Uint8Array.from(atob(s), c=> c.charCodeAt(0));
const aTexto = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const reto = ()=> crypto.getRandomValues(new Uint8Array(32));

async function activarFaceID(){
  const cred = await navigator.credentials.create({ publicKey:{
    challenge: reto(),
    rp: { name:'Finanzas' },
    user: { id: reto().slice(0,16), name: (currentUser && currentUser.email) || 'finanzas', displayName:'Finanzas' },
    pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
    authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
    timeout: 60000,
  }});
  if(!cred) throw new Error('sin credencial');
  localStorage.setItem(CLAVE_FACEID, aTexto(cred.rawId));
}

function desactivarFaceID(){
  try{ localStorage.removeItem(CLAVE_FACEID); }catch(e){}
}

async function pedirFaceID(){
  const id = localStorage.getItem(CLAVE_FACEID);
  if(!id) return true;
  const cred = await navigator.credentials.get({ publicKey:{
    challenge: reto(),
    allowCredentials: [{ type:'public-key', id: aBytes(id) }],
    userVerification: 'required',
    timeout: 60000,
  }});
  return !!cred;
}

/* ---------- Categorías (el concepto que escribes en cada gasto) ---------- */
/* Es texto libre, así que "Gasolina", "gasolina" y "GASOLINA" son la misma
   cosa: se agrupan sin mayúsculas ni tildes y se enseña la forma que más
   uses. Nada se inventa: solo salen categorías que hayas escrito tú. */
function claveCategoria(texto){
  return (texto || '').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

const SIN_CONCEPTO = '__sin__';

/* Agrupa gastos por categoría. Devuelve, por clave: el nombre que más veces
   has escrito, cuántas veces y cuánto suma. */
function agruparPorCategoria(gastos){
  const mapa = new Map();
  for(const g of gastos){
    const clave = claveCategoria(g.concepto) || SIN_CONCEPTO;
    let e = mapa.get(clave);
    if(!e){ e = { clave, total:0, veces:0, nombres:new Map() }; mapa.set(clave, e); }
    e.total += importeGasto(g);
    e.veces += 1;
    if(clave !== SIN_CONCEPTO){
      const n = (g.concepto || '').trim();
      e.nombres.set(n, (e.nombres.get(n) || 0) + 1);
    }
  }
  for(const e of mapa.values()){
    if(e.clave === SIN_CONCEPTO){ e.nombre = 'Sin concepto'; continue; }
    // La grafía más repetida gana; así se ve como tú la escribes.
    e.nombre = [...e.nombres.entries()].sort((a,b)=> b[1] - a[1])[0][0];
  }
  return [...mapa.values()];
}

/* Chips de categorías frecuentes: las que más veces has usado EN ESA HUCHA,
   para que al elegir Coche te ofrezca gasolina y no cenas. */
function categoriasFrecuentes(bucketKey, max = 6){
  const gastos = (state.gastos || []).filter(g=> g.bucket === bucketKey && (g.concepto || '').trim());
  return agruparPorCategoria(gastos)
    .sort((a,b)=> b.veces - a.veces || b.total - a.total)
    .slice(0, max)
    .map(e=> e.nombre);
}

/* Gasto del mes en curso por categoría, de todas las huchas juntas. */
function categoriasDelMes(){
  const mes = currentMonthLabel();
  const gastos = (state.gastos || []).filter(g=> etiquetaMesDe(g.date) === mes);
  const total = gastos.reduce((s,g)=> s + importeGasto(g), 0);
  return {
    total,
    lista: agruparPorCategoria(gastos).sort((a,b)=> b.total - a.total),
  };
}

/* ---------- Tendencia de gasto mensual (todas las huchas juntas) ---------- */
const MESES_TENDENCIA = 6;

/* Recorre los últimos meses de calendario, no los que aparezcan en el libro:
   así un mes sin ningún gasto sale como cero en vez de desaparecer, que es
   justo lo que hay que ver en una tendencia. */
function serieGastoMensual(n = MESES_TENDENCIA){
  const hoy = new Date();
  const diaHoy = hoy.getDate();
  const serie = [];
  for(let i = n - 1; i >= 0; i--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    serie.push({
      anio: d.getFullYear(), mes: d.getMonth(),
      etiqueta: `${monthNames[d.getMonth()]} DE ${d.getFullYear()}`,
      corto: monthNames[d.getMonth()].slice(0,3),
      total: 0, hastaHoy: 0, esActual: i === 0,
    });
  }
  for(const g of (state.gastos || [])){
    const d = new Date(g.date);
    if(isNaN(d.getTime())) continue;
    const fila = serie.find(x=> x.mes === d.getMonth() && x.anio === d.getFullYear());
    if(!fila) continue;
    const imp = importeGasto(g);
    fila.total += imp;
    // Lo gastado a estas alturas del mes, para poder comparar al mismo ritmo.
    if(d.getDate() <= diaHoy) fila.hastaHoy += imp;
  }
  return serie;
}

/* El mes en curso va a medias, así que compararlo contra meses enteros diría
   "has ahorrado" cada día 2. Se compara con lo que solías llevar gastado a
   estas mismas alturas. */
function resumenGastoMensual(){
  const serie = serieGastoMensual();
  const actual = serie[serie.length - 1];
  const previos = serie.slice(0, -1).filter(m=> m.total > 0);
  if(previos.length === 0) return null;
  const mediaRitmo = previos.reduce((s,m)=> s + m.hastaHoy, 0) / previos.length;
  const mediaMes   = previos.reduce((s,m)=> s + m.total, 0) / previos.length;
  return {
    serie, actual, previos, mediaRitmo, mediaMes,
    diferencia: mediaRitmo - actual.hastaHoy,   // positiva = has gastado menos
    dia: new Date().getDate(),
  };
}

/* ---------- Lo que sueles gastar en cada hucha ---------- */
/* Media mensual real, sacada del libro. El mes en curso va a medias (aún no
   ha terminado), así que se deja fuera mientras haya meses completos con los
   que comparar; si no, se usa lo que haya. */
function gastoMedioMensual(key, mesesMax=6){
  const gastos = Array.isArray(state.gastos) ? state.gastos : [];
  const actual = currentMonthLabel();
  const porMes = new Map();
  for(const g of gastos){
    if(g.bucket !== key) continue;
    const mes = etiquetaMesDe(g.date);
    porMes.set(mes, (porMes.get(mes) || 0) + (g.descontado != null ? g.descontado : g.importe));
  }
  if(porMes.size === 0) return 0;
  let meses = [...porMes.entries()];
  const completos = meses.filter(([mes]) => mes !== actual);
  if(completos.length > 0) meses = completos;
  meses = meses.slice(0, mesesMax);
  return meses.reduce((s,[,v])=> s + v, 0) / meses.length;
}

/* Se avisa cuando el saldo no llega a lo que sueles gastar en esa hucha en
   un mes: el umbral sale de tu propio historial, no de un número fijo. */
function huchaCorta(key){
  const media = gastoMedioMensual(key);
  if(media <= 0) return null;
  const saldo = state.huchas[key] || 0;
  if(saldo >= media) return null;
  return { media, saldo };
}

function avisoGastoRegistrado(g){
  if(!g) return;
  const bucket = BUCKETS.find(b=>b.key===g.bucket);
  const nombre = bucket ? bucket.name : g.bucket;
  const detalle = g.concepto ? ' · ' + g.concepto : '';
  showToast(fmt(g.descontado) + ' de ' + nombre + detalle, ()=> deshacerGasto(g.id));
}

/* ---------- Teclado numérico propio ----------
   inputmode="decimal" en iOS sigue sacando un teclado con letras y una
   coma escondida. Para meter importes deprisa va mejor un teclado propio:
   el campo se marca readonly para que el sistema no saque el suyo. */
const TECLAS = ['1','2','3','4','5','6','7','8','9',',','0','⌫'];

function tecladoHTML(){
  return `<div class="teclado">` + TECLAS.map(t=>
    `<button type="button" class="tecla${t==='⌫'?' borrar':''}" data-tecla="${t}">${t}</button>`
  ).join('') + `</div>`;
}

/* Devuelve lo que quedaría en el campo tras pulsar una tecla, sin tocar el
   DOM: así se puede probar la lógica sin navegador. */
function aplicarTecla(valor, tecla){
  const v = valor || '';
  if(tecla === '⌫') return v.slice(0, -1);
  if(tecla === ','){
    if(v.includes(',')) return v;           // una coma como mucho
    return (v === '' ? '0' : v) + ',';
  }
  // Como mucho dos decimales, que es lo que se muestra.
  const coma = v.indexOf(',');
  if(coma !== -1 && v.length - coma > 2) return v;
  if(v === '0') return tecla;               // no dejar 0 a la izquierda
  return v + tecla;
}

function wireTeclado(input){
  if(!input) return;
  document.querySelectorAll('[data-tecla]').forEach(b=>{
    b.addEventListener('click', ()=>{
      input.value = aplicarTecla(input.value, b.dataset.tecla);
      input.dispatchEvent(new Event('input', {bubbles:true}));
    });
  });
}

/* --- Gasto rápido: el mismo panel sirve para crear y para editar --- */
/* Se guarda en una variable en vez de leerlo del DOM porque el panel se
   repinta entero al cambiar de hucha, y si no se perderían los campos. */
let sheetGasto = null;

function abrirGastoSheet(gasto){
  sheetGasto = gasto
    ? { id:gasto.id, bucket:gasto.bucket, importe:String(gasto.importe).replace('.',','), concepto:gasto.concepto || '' }
    : { id:null, bucket:BUCKETS[0].key, importe:'', concepto:'' };
  renderGastoSheet();
}

function renderGastoSheet(){
  if(!sheetGasto) return;
  const editando = !!sheetGasto.id;
  const chips = BUCKETS.map(b=>`
    <button class="bucket-chip ${b.key===sheetGasto.bucket?'active':''}" data-bucket="${b.key}">
      <span class="dot" style="background:${b.color}"></span>${b.name}
    </button>
  `).join('');
  const bucket = BUCKETS.find(b=>b.key===sheetGasto.bucket);
  const saldo = state.huchas[sheetGasto.bucket] || 0;
  const media = gastoMedioMensual(sheetGasto.bucket);
  // Saber lo que sueles gastar aquí justo antes de gastar es el momento en
  // que más sirve, así que va en la propia línea de saldo.
  const suele = media > 0
    ? ` · sueles gastar <b style="color:var(--text-dim)">${fmt(media)}</b>/mes`
    : '';
  // Salen de lo que has escrito tú en esa hucha; si nunca has puesto nada,
  // no hay chips que enseñar.
  const frecuentes = categoriasFrecuentes(sheetGasto.bucket);

  openSheet(`
    <h2>${editando ? '✏️ Editar gasto' : '💸 Gasto rápido'}</h2>
    <div class="bucket-picker">${chips}</div>
    <div class="hint" style="margin:-6px 0 12px; text-align:left;">Saldo en ${bucket.name}: ${fmt(saldo)}${suele}</div>
    <input class="sheet-amount" id="gastoAmount" placeholder="0,00" value="${sheetGasto.importe}" readonly>
    ${tecladoHTML()}
    ${frecuentes.length ? `
      <div class="frec-titulo">Lo que sueles apuntar en ${bucket.name.toLowerCase()}</div>
      <div class="frec-chips">
        ${frecuentes.map(n=>`
          <button type="button" class="frec-chip${claveCategoria(n)===claveCategoria(sheetGasto.concepto)?' activa':''}"
                  data-frec="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join('')}
      </div>` : ''}
    <input class="sheet-note" id="gastoConcepto" placeholder="En qué (opcional)" value="${escapeHtml(sheetGasto.concepto)}">
    <button class="btn ${editando ? '' : 'danger'}" id="btnConfirmGasto">${ICONS.check}${editando ? 'Guardar cambios' : 'Descontar'}</button>
    ${editando ? `<button class="btn ghost" id="btnBorrarGasto" style="margin-top:10px;">${ICONS.trash}Eliminar gasto</button>` : ''}
  `);

  document.querySelectorAll('[data-frec]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const campo = document.getElementById('gastoConcepto');
      const valor = chip.dataset.frec;
      // Volver a tocar la misma la quita, por si se pulsa sin querer.
      sheetGasto.concepto = claveCategoria(campo.value) === claveCategoria(valor) ? '' : valor;
      campo.value = sheetGasto.concepto;
      document.querySelectorAll('[data-frec]').forEach(c=>
        c.classList.toggle('activa', claveCategoria(c.dataset.frec) === claveCategoria(sheetGasto.concepto)));
    });
  });

  const leerCampos = ()=>{
    const a = document.getElementById('gastoAmount');
    const c = document.getElementById('gastoConcepto');
    if(a) sheetGasto.importe = a.value;
    if(c) sheetGasto.concepto = c.value;
  };

  document.querySelectorAll('.bucket-picker .bucket-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      leerCampos();
      sheetGasto.bucket = chip.dataset.bucket;
      renderGastoSheet();
    });
  });

  document.getElementById('btnConfirmGasto').addEventListener('click', ()=>{
    leerCampos();
    const val = parseFloat((sheetGasto.importe||'0').replace(',','.')) || 0;
    if(val <= 0){ closeSheet(); return; }
    const g = editando
      ? editarGasto(sheetGasto.id, sheetGasto.bucket, val, sheetGasto.concepto)
      : registrarGasto(sheetGasto.bucket, val, sheetGasto.concepto);
    closeSheet();
    repintarTrasGasto();
    if(!editando) avisoGastoRegistrado(g);
  });

  const borrar = document.getElementById('btnBorrarGasto');
  if(borrar){
    borrar.addEventListener('click', ()=>{
      const id = sheetGasto.id;
      closeSheet();
      deshacerGasto(id);
    });
  }

  wireTeclado(document.getElementById('gastoAmount'));
}

/* --- Cierre de mes: qué pasó en el mes que acabas de dejar atrás --- */
function etiquetaMesAnterior(){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - 1);
  return `${monthNames[d.getMonth()]} DE ${d.getFullYear()}`;
}

function resumenDelMes(etiqueta){
  const gastos = (state.gastos || []).filter(g=> etiquetaMesDe(g.date) === etiqueta);
  const porHucha = BUCKETS.map(b=>({
    bucket: b,
    total: gastos.filter(g=> g.bucket === b.key).reduce((s,g)=> s + importeGasto(g), 0),
  })).filter(x=> x.total > 0).sort((a,b)=> b.total - a.total);
  // Un mes puede tener varias entradas (segunda nómina, ingresos extra),
  // así que se suman todas en vez de coger la primera.
  const entradas = state.historial.filter(h=> h.label === etiqueta);
  const entrado = entradas.reduce((s,h)=> s + (h.neto || 0), 0);
  const ahorrado = entradas.reduce((s,h)=> s + ((h.aportadoHuchas||{}).ahorro || 0), 0);

  // El mes anterior a ese, para decir si se ahorró más o menos. El historial
  // va del más nuevo al más viejo, así que basta con la lista de meses
  // distintos en ese orden y coger el siguiente al nuestro.
  const meses = [];
  for(const h of state.historial) if(!meses.includes(h.label)) meses.push(h.label);
  const i = meses.indexOf(etiqueta);
  const etiquetaPrevia = i === -1 ? meses[0] : meses[i + 1];
  const ahorradoPrevio = etiquetaPrevia
    ? state.historial.filter(h=> h.label === etiquetaPrevia)
        .reduce((s,h)=> s + ((h.aportadoHuchas||{}).ahorro || 0), 0)
    : null;

  return {
    etiqueta, porHucha, entradas, entrado, ahorrado, ahorradoPrevio,
    gastado: porHucha.reduce((s,x)=> s + x.total, 0),
  };
}

function renderCierreMesSheet(r){
  const dif = r.ahorradoPrevio != null ? r.ahorrado - r.ahorradoPrevio : null;
  const comparativa = dif == null ? '' : `
    <div class="cierre-dif ${dif >= 0 ? 'bien' : 'mal'}">
      ${dif >= 0 ? '▲' : '▼'} ${fmt(Math.abs(dif))} ${dif >= 0 ? 'más' : 'menos'} de ahorro que el mes anterior
    </div>`;
  openSheet(`
    <h2>Cómo fue ${r.etiqueta.toLowerCase()}</h2>
    ${r.entradas.length ? `
      <div class="highlight" style="margin-bottom:14px;">
        <div class="label">Entró${r.entradas.length > 1 ? ` · ${r.entradas.length} ingresos` : ''}</div>
        <div class="value">${fmt(r.entrado)}</div>
      </div>` : ''}
    ${r.porHucha.length ? `
      <div class="sheet-group">
        <div class="sheet-group__title">Gastado · ${fmt(r.gastado)}</div>
        ${r.porHucha.map(x=>`
          <div class="bank-split__row">
            <span class="bank-split__dot" style="background:${x.bucket.color}"></span>
            <span class="bank-split__name">${x.bucket.name}</span>
            <span class="bank-split__amt">${fmt(x.total)}</span>
          </div>`).join('')}
      </div>` : `<div class="hint" style="text-align:left; margin-bottom:14px;">No registraste ningún gasto ese mes.</div>`}
    ${comparativa}
    <button class="btn ghost" id="btnCierreCriba" style="margin-top:14px;">Cribar lo que sobró</button>
    <button class="btn" id="btnCierreHecho" style="margin-top:10px;">${ICONS.check}Hecho</button>
  `);
  document.getElementById('btnCierreCriba').addEventListener('click', ()=> renderCribaSheet());
  document.getElementById('btnCierreHecho').addEventListener('click', ()=> closeSheet());
}

/* --- Cribar sobras: repartir lo que sobró del mes entre las huchas --- */
let sobraGastos = 0, sobraOcio = 0;
function renderCribaSheet(){
  const total = sobraGastos + sobraOcio;
  const perHucha = total / CRIBA_BUCKETS.length;
  const names = CRIBA_BUCKETS.map(b=>b.name).join(', ');
  openSheet(`
    <h2>🔻 Cribar sobras del mes</h2>
    <div class="hint" style="text-align:left; margin:-6px 0 12px;">Se reparte a partes iguales entre ${names}</div>
    <div class="edit-field"><div class="label">Sobra de gastos fijos</div><input inputmode="decimal" id="cribaGastos" value="${sobraGastos||''}"></div>
    <div class="edit-field"><div class="label">Sobra de ocio libre</div><input inputmode="decimal" id="cribaOcio" value="${sobraOcio||''}"></div>
    <div class="highlight" style="margin:14px 0;">
      <div class="label">Por hucha (1/${CRIBA_BUCKETS.length})</div>
      <div class="value" id="cribaPerHucha">${fmt(perHucha)}</div>
    </div>
    <button class="btn ghost" id="btnConfirmCriba">Repartir en Ahorro, Coche y Caprichos</button>
  `);
  document.getElementById('cribaGastos').addEventListener('input', e=>{
    sobraGastos = parseFloat((e.target.value||'0').replace(',','.'))||0;
    document.getElementById('cribaPerHucha').textContent = fmt((sobraGastos+sobraOcio)/CRIBA_BUCKETS.length);
  });
  document.getElementById('cribaOcio').addEventListener('input', e=>{
    sobraOcio = parseFloat((e.target.value||'0').replace(',','.'))||0;
    document.getElementById('cribaPerHucha').textContent = fmt((sobraGastos+sobraOcio)/CRIBA_BUCKETS.length);
  });
  document.getElementById('btnConfirmCriba').addEventListener('click', ()=>{
    const total = sobraGastos + sobraOcio;
    if(total<=0){ closeSheet(); return; }
    const share = total/CRIBA_BUCKETS.length;
    CRIBA_BUCKETS.forEach(b=> state.huchas[b.key] += share);
    sobraGastos = 0; sobraOcio = 0;
    save();
    updateQuickStats();
    if(activeTab==='huchas') renderHuchas();
    closeSheet();
    // El confeti sale de las cifras de arriba, que es donde aterriza el dinero.
    confettiBurst(document.getElementById('quickStats'));
  });
}

document.getElementById('fabGasto').addEventListener('click', ()=> abrirGastoSheet(null));

/* ============ TABS / SWIPE ============ */
const tabs = ['resumen','huchas','historial'];
let activeTab = 'resumen';
const renderers = {resumen:renderResumen, huchas:renderHuchas, historial:renderHistorial};

const viewsEl = document.getElementById('views');

/* Una pestaña a la vez. El carrusel que las llevaba todas montadas se movía
   bien en el banco de pruebas pero no en un móvil de verdad: durante el
   arrastre había dos vistas enteras maquetándose y pintándose a la vez. */

/* Las vistas que no se ven quedan desfasadas cuando cambian los datos. En
   vez de repintar las tres en cada cambio, se marcan y se repinta la que
   toca justo antes de enseñarla. */
/* Arranca con las tres pendientes: ninguna se ha pintado todavía. */
const vistasSucias = new Set(tabs);
function marcarVistasSucias(){
  tabs.forEach(t=>{ if(t !== activeTab) vistasSucias.add(t); });
}

let scrollPorTab = {};

function setTab(name, animar = true){
  const idx = tabs.indexOf(name);
  if(idx === -1) return;

  if(name !== activeTab) scrollPorTab[activeTab] = window.scrollY;
  const saliente = document.getElementById('view-' + activeTab);
  const entrante = document.getElementById('view-' + name);
  activeTab = name;

  // Lo caro se hace mientras la vista sigue oculta: si se repinta con la
  // animación ya empezada, se come sus primeros frames y se ve a tirones.
  if(vistasSucias.has(name)){
    vistasSucias.delete(name);
    renderers[name]();
  }

  document.querySelectorAll('.navbtn').forEach((b,i)=> b.classList.toggle('active', i === idx));
  document.getElementById('navpill').style.transform = `translateX(${idx * 100}%)`;

  if(saliente !== entrante) saliente.classList.remove('active');
  entrante.classList.add('active');
  entrante.classList.remove('entrando');

  if(animar){
    // Forzar el reflujo antes de volver a poner la clase reinicia la
    // animación aunque se cambie de pestaña dos veces seguidas.
    void entrante.offsetWidth;
    entrante.classList.add('entrando');
  }

  // Cada pestaña recuerda por dónde iba, en vez de heredar el scroll de la
  // anterior y aparecer a media altura.
  const y = scrollPorTab[name] || 0;
  window.scrollTo(0, Math.min(y, Math.max(0, document.body.scrollHeight - window.innerHeight)));
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=> setTab(btn.dataset.tab));
});

/* ============ SERVICE WORKER ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

function processUrlGasto(){
  const params = new URLSearchParams(location.search);
  if(params.get('add') === 'gasto'){
    const monto = parseFloat((params.get('monto')||'0').replace(',','.')) || 0;
    const catKey = (params.get('categoria')||'').toLowerCase();
    const bucket = BUCKETS.find(b => b.key === catKey);
    if(monto > 0 && bucket){
      const g = registrarGasto(bucket.key, monto, params.get('concepto') || '');
      // La app todavia se esta pintando; el aviso espera a que haya UI.
      setTimeout(()=> avisoGastoRegistrado(g), 700);
    }
    history.replaceState({}, '', location.pathname);
  }
}

/* ============ INIT ============
   Ya no se llama sola al cargar el script: la dispara onAuthStateChanged
   (más arriba) en cuanto hay sesión, la primera vez que la hay. */
/* Se pide antes de pintar nada: si falla o se cancela, la app no llega a
   verse. Cerrar sesión sigue disponible para no quedarse encerrado, por
   ejemplo si el aparato pierde la huella registrada. */
function pedirDesbloqueo(){
  return new Promise(resolve=>{
    if(!faceIDActivo() || !hayFaceID()){ resolve(); return; }
    const pantalla = document.getElementById('lockScreen');
    const err = document.getElementById('lockErr');
    pantalla.classList.add('open');

    const intentar = async ()=>{
      err.textContent = '';
      try{
        if(await pedirFaceID()){
          pantalla.classList.remove('open');
          resolve();
        }
      }catch(e){
        err.textContent = e && e.name === 'NotAllowedError'
          ? 'No se ha podido comprobar. Inténtalo otra vez.'
          : 'Este dispositivo no ha podido desbloquear (' + ((e && e.name) || 'error') + ').';
      }
    };
    document.getElementById('lockBtn').addEventListener('click', intentar);
    document.getElementById('lockSalir').addEventListener('click', ()=>{
      desactivarFaceID();
      auth.signOut();
      pantalla.classList.remove('open');
    });
    intentar();
  });
}

async function iniciarApp(){
  await pedirDesbloqueo();
  await load();
  processUrlGasto();
  updateQuickStats();

  // La primera colocación va sin animación, para no ver la cinta y la píldora
  // deslizándose solas al abrir.
  const pill = document.getElementById('navpill');
  pill.style.transition = 'none';
  setTab('resumen', false);
  requestAnimationFrame(()=>{ pill.style.transition = ''; });

  // Las otras se pintan en tiempo libre, ya servida la primera pantalla: así
  // al cambiar de pestaña no hay nada que construir y la animación arranca
  // limpia desde el primer frame.
  const pintarRestantes = ()=>{
    tabs.filter(t=> t !== activeTab).forEach(t=>{ renderers[t](); vistasSucias.delete(t); });
  };
  if(window.requestIdleCallback) requestIdleCallback(pintarRestantes, {timeout:1200});
  else setTimeout(pintarRestantes, 200);
}
